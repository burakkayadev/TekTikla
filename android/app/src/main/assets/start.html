<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TekTıkla</title>
<!-- Android uygulamasının karşılama sayfası: bilgisayara bağlanma (MainActivity.page ?s=durum ile açar) -->
<style>
  :root { --bg: #050505; --panel: rgba(255, 255, 255, .035); --panel-2: rgba(255, 255, 255, .075); --border: rgba(255, 255, 255, .09);
    --border-strong: rgba(255, 255, 255, .2); --text: #F2F2F2; --muted: #8E8E8E; --faint: #5E5E5E; --err: #FFA3A6;
    --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { display: grid; place-items: center; padding: 28px 18px; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  .glow { position: fixed; top: -30vh; left: 50%; width: 120vw; height: 70vh; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .08), transparent); }
  main { position: relative; width: min(420px, 100%); text-align: center; animation: rise .5s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .logo { width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 23px; display: grid; place-items: center;
    background: linear-gradient(180deg, #232327, #060607); border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 16px 44px -18px rgba(255, 255, 255, .35); }
  .logo svg { width: 42px; height: 42px; fill: #fff; stroke: #fff; stroke-width: .5; stroke-linejoin: round; }
  h1 { margin-bottom: 8px; font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  p { color: var(--muted); font-size: 14.5px; }
  .spin { width: 44px; height: 44px; margin: 4px auto 22px; border-radius: 50%; border: 3px solid var(--panel-2);
    border-top-color: #fff; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .acts { margin-top: 22px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px; margin-top: 10px;
    border-radius: 15px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font: 650 15.5px system-ui, sans-serif; transition: transform .15s var(--ease); }
  .btn.primary { background: #fff; color: #050505; border: 0; box-shadow: 0 12px 32px -18px rgba(255, 255, 255, .6); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .or { display: flex; align-items: center; gap: 12px; margin: 24px 0 4px; color: var(--faint); font-size: 12.5px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  input { width: 100%; height: 50px; margin-top: 10px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font: 16px system-ui, sans-serif; outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--border-strong); }
  input::placeholder { color: var(--faint); }
  #code { text-align: center; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  #addr { text-align: center; }
  .err { margin-top: 14px; color: var(--err); font-size: 13.5px; }
  .note { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 24px; color: var(--faint); font-size: 12.5px; }
  .note svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="logo"><svg viewBox="0 0 24 24"><rect x="3.6" y="5.2" width="16.8" height="3.2" rx="1.6"/><rect x="6.4" y="5.2" width="3.2" height="14" rx="1.6"/><rect x="14.4" y="5.2" width="3.2" height="9.4" rx="1"/><path d="M12.4 13.8h7.2L16 19.2z"/></svg></div>
  <div class="spin hidden" id="busy"></div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <p class="err hidden" id="err"></p>
  <div class="acts" id="acts">
    <button class="btn hidden" id="retry"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg><span data-t="retry"></span></button>
    <button class="btn primary" id="scan"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v.01M14 21h3M20.5 17.5V21"/></svg><span data-t="scan"></span></button>
    <div class="or"><span data-t="or"></span></div>
    <input id="addr" inputmode="url" autocomplete="off" spellcheck="false" autocapitalize="off">
    <input id="code" maxlength="11" autocomplete="off" spellcheck="false" autocapitalize="characters">
    <button class="btn" id="go"><span data-t="connect"></span></button>
  </div>
  <div class="note"><svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.4a10 10 0 0 1 14 0M8.5 15.9a5 5 0 0 1 7 0"/><path d="M12 19.3h.01"/></svg><span data-t="note"></span></div>
</main>

// durum → [başlık, açıklama, görünüm]; görünüm: busy = bekleniyor, retry = "Tekrar dene" öne çıkar
const VIEWS = {
  first: ["first_title", "first_text", ""], connecting: ["connecting", "", "busy"], searching: ["searching_title", "searching_text", "busy"],
  net: ["net_title", "net_text", "retry"], key: ["key_title", "key_text", ""], wifi: ["wifi_title", "wifi_text", "retry"],
  bad: ["first_title", "first_text", ""], badqr: ["first_title", "first_text", ""],
};
const $ = (id) => document.getElementById(id);
const app = window.TekTiklaAndroid;
const lang = (navigator.language || "en").toLowerCase().slice(0, 2);
const t = T[lang === "in" ? "id" : lang] || T.en;
document.documentElement.lang = lang;
if (lang === "ar") document.documentElement.dir = "rtl";
document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
$("addr").placeholder = t.addr_ph;
$("code").placeholder = t.code_ph;

function show(state) {
  const [title, text, mode] = VIEWS[state] || VIEWS.first;
  $("title").textContent = t[title];
  $("text").textContent = text ? t[text] : "";
  $("text").classList.toggle("hidden", !text);
  $("busy").classList.toggle("hidden", mode !== "busy");
  $("acts").classList.toggle("hidden", mode === "busy");
  $("retry").classList.toggle("hidden", mode !== "retry");
  $("retry").classList.toggle("primary", mode === "retry");
  $("scan").classList.toggle("primary", mode !== "retry");
  $("err").textContent = state === "bad" || state === "badqr" ? t[state] : "";
  $("err").classList.toggle("hidden", !$("err").textContent);
}

$("code").addEventListener("input", (e) => {
  const c = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
  e.target.value = c.length > 5 ? c.slice(0, 5) + "-" + c.slice(5) : c;
});
$("scan").addEventListener("click", () => app && app.scan());
$("retry").addEventListener("click", () => { show("connecting"); if (app) app.retry(); });
$("go").addEventListener("click", () => {
  if (!app) return;
  show("connecting");
  app.connect($("addr").value, $("code").value);
});
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
show(new URLSearchParams(location.search).get("s") || "first");
</script>
